{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SocialFlow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/glass.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="grid-overlay"></div>

  {% if messages %}
  <div class="messages-container">
    {% for message in messages %}
    <div class="glass-card message-toast" role="status">
      <p class="message-toast-text">{{ message }}</p>
      <button type="button" class="message-toast-close" aria-label="Hide notification" title="Hide">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  {% block navbar %}{% endblock %}

  <main class="page-wrapper {% block wrapper_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Facebook OAuth appends #_=_ to the redirect URL — strip it for a clean address bar
    if (window.location.hash === '#_=_') {
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
    }
    document.addEventListener('click', function (event) {
      var closeBtn = event.target.closest('.message-toast-close');
      if (closeBtn) {
        var toast = closeBtn.closest('.message-toast');
        if (toast) toast.remove();
        return;
      }
      var toggle = event.target.closest('.password-toggle');
      if (!toggle) return;
      var field = toggle.closest('.password-field');
      var input = field && field.querySelector('input');
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      toggle.classList.toggle('is-visible', show);
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.setAttribute('title', show ? 'Hide password' : 'Show password');
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
