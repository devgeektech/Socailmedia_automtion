{% extends 'base.html' %}
{% block title %}Check Your Email — SocialFlow{% endblock %}
{% block content %}
<div class="glass-card auth-card" style="text-align:center;">
  <a href="{% url 'core:home' %}" class="logo" style="justify-content:center;">
    <div class="logo-icon">◈</div>
    <span class="logo-text">SocialFlow</span>
  </a>
  <h1 class="auth-title">Check your email</h1>
  <p class="auth-subtitle">
    If an account exists with that email, we've sent password reset instructions.
    Check your inbox and spam folder.
  </p>
  <a href="{% url 'accounts:login' %}" class="btn-primary" style="margin-top:1rem;">Back to Login</a>
</div>
{% endblock %}
