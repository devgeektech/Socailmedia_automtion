{% extends 'dashboard/base_admin.html' %}
{% block title %}Users — Admin{% endblock %}

{% block admin_content %}
<div class="admin-page-header">
  <div>
    <h1 class="admin-page-title">Users</h1>
    <p class="admin-page-sub" id="admin-list-meta">{{ total }} user{{ total|pluralize }}</p>
  </div>
</div>

<form method="get" class="admin-filters glass-card" id="admin-filters" data-ajax-filters>
  <input type="search" name="q" id="filter-q" value="{{ q }}" class="glass-input" placeholder="Search name or email…" autocomplete="off">
  <select name="status" id="filter-status" class="glass-input">
    <option value="">All accounts</option>
    <option value="active" {% if status == 'active' %}selected{% endif %}>Active</option>
    <option value="inactive" {% if status == 'inactive' %}selected{% endif %}>Deactivated</option>
  </select>
</form>

<div id="admin-results">
  {% include 'dashboard/_users_list_results.html' %}
</div>
{% endblock %}
